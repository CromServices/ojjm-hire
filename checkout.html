<!doctype html>
<html lang="en-AU" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request hire – OJJM Hire</title>
  <meta name="description" content="OJJM Hire — plant and tools for Fremantle and south metro.">
  <link rel="stylesheet" href="css/theme.css">
  <style>:root{--ink:#1A1C1E;--panel:#F4F1EA;--copper:#C45C26;--moss:#2F4F3E;--hivis:#C8FF00}</style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <div data-header></div>
  <main id="MainContent">
<section class="section"><div class="wrap">
  <div class="section-head">
    <div class="eyebrow">OJJM HIRE</div>
    <h1 class="h1 sm">Request hire</h1>
    <p class="lede">Preview how a hire request would look. Nothing you enter is sent from this site.</p>
  </div>
  <div data-summary style="margin-bottom:1.5rem"></div>
  <div class="booking-notice">Online booking isn't open yet. Nothing you enter here is sent or saved, and no booking is made.</div>
  <form class="checkout-form" data-checkout-form>
    <label>Name <input name="name" required autocomplete="name"></label>
    <label>Email <input name="email" type="email" required autocomplete="email"></label>
    <label>Phone <input name="phone" type="tel" required autocomplete="tel"></label>
    <label>Notes <input name="notes" autocomplete="off"></label>
    <button class="btn btn-copper" type="submit">Preview order</button>
    <p class="privacy-line">Your details stay in this browser tab only and are cleared once the preview shows.</p>
  </form>
</div></section>
</main>
  <div data-footer></div>
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
